# Maschinenliste und Suchprofile für die Steckerfertigung.
# Diese Datei ist der Input des Radars: Zeilen anpassen, ergänzen oder löschen.
# Hier stehen nur generische Maschinenklassen. Stückzahlen gehören in die lokale Datei
# config/bedarf.local.yaml, die nicht versioniert wird (Vorlage: bedarf.beispiel.yaml).

# Naeherungskurse fuer die Spalte "Preis EUR (ca.)" - bitte vor Nutzung anpassen.
wechselkurse:
  EUR: 1.0
  USD: 0.90

# Neutrale Absenderangaben für die Anfrage-Entwürfe (werden nicht versendet).
anfrage:
  absender: "[Name]"
  firma: "[neutrale Firma]"
  email: "[E-Mail-Adresse]"

# Umfang der Aktionsliste und Modell für die optionale LLM-Extraktion (--llm).
aktionsliste:
  je_maschinenart: 15
llm:
  modell: claude-opus-5-5

maschinen:
  - id: stanzautomat
    name: Hochleistungs-Stanzautomat
    gruppe: Stanzen
    spez:
      baujahr_min: 2000
      kraft_kn: [150, 800]   # bis 80 t
    hersteller: [Bruderer, Yamada Dobby, Kyori, Aida, Haulick, Raster, Minster, Schuler]
    begriffe: [stanzautomat, schnellläufer, schnelllaeufer, high speed press, high speed and automatic, hochleistungsstanz, stanzpresse]
    ausschluss: [vorschub, haspel, richtmaschine, werkzeug, ersatzteil, feeder only]
    # Je Quelle: Kategorie-/Stichwortseiten. Maschinensucher: Pfad (/Name/ci-123) oder
    # Stichwort; Resale: Stichwort-Slug; Surplus Record: Kategorie[/Hersteller].
    quellen:
      maschinensucher: [/Stanzautomaten/ci-1194, bruderer]
      resale: [bruderer-stanzautomat, stanzautomat]
      surplusrecord: [high-speed-and-automatic-presses]

  - id: stanzbiegeautomat
    name: Stanzbiegeautomat
    aktiv: false   # nicht Teil der aktuellen Bedarfsliste
    gruppe: Stanzen
    spez:
      baujahr_min: 1995
    hersteller: [Bihler, Finzer, Otto Bihler, Wafios, Schmale, Meyer Roth & Pastor, MRP, Nilson]
    hersteller_pflicht: true   # Kategorie enthält auch Biegezentren für Blech
    begriffe: [stanzbiegeautomat, stanz- & biegeautomat, stanz- und biegeautomat, stanz- biegeautomat, biegeautomat, stanzautomat, multislide, four slide, fourslide]
    ausschluss: [werkzeug, ersatzteil, haspel, steuerkarte, steuerung]
    quellen:
      maschinensucher: [/Stanz-Biegeautomaten/ci-1053, bihler]
      resale: [bihler-stanzautomaten]

  - id: langdrehautomat
    name: CNC-Langdrehautomat
    gruppe: Drehen
    spez:
      baujahr_min: 2008
    hersteller: [Citizen, Star, Tornos, Tsugami, Traub, Hanwha, Nomura, Manurhin, Maier, Index, DMG, Gildemeister, Swistek, Nexturn, Polygim, KSI, Goodway, Ganesh, Hardinge, Miyano, Doosan]
    hersteller_pflicht: true   # Kategorie enthält auch Langbett-Drehmaschinen
    wunschmodelle: [SR-20, SR20, SB-20, SB20]   # Star SR-20 / SB-20
    begriffe: [langdrehautomat, langdreher, swiss type, swiss-type, swiss automatic, swiss lathe, swiss turn, sliding head]
    ausschluss: [stangenlader, lademagazin, bar feeder only, spannzange]
    quellen:
      maschinensucher: [/Langdrehautomaten/ci-1135]
      resale: [langdrehautomat, citizen-langdrehautomaten]
      surplusrecord: [swiss-type-and-lathe-cnc-automatic-screw-machines]

  - id: rundtaktmaschine
    name: Rundtaktmaschine
    gruppe: Drehen
    spez:
      baujahr_min: 2005
    hersteller: [Winema, Pfiffner, Hydromat, Mikron, Kneissler, Witzig & Frank, Wolf, Icon, Gnutti, Buffoli, Riello]
    begriffe: [rundtakt, transfermaschine, rotary transfer]
    ausschluss: [spannzange, ersatzteil]
    wunschmodelle: [Flexmaster, Flex-Master, RV 20, RV20]   # Winema Flex-Master
    quellen:
      maschinensucher: [rundtaktmaschine]

  - id: mehrspindler
    name: CNC-Mehrspindeldrehautomat
    aktiv: false   # nicht Teil der aktuellen Bedarfsliste
    gruppe: Drehen
    spez:
      baujahr_min: 2005
    hersteller: [Index, Tornos, Schütte, Schuette, Gildemeister, Wickman, Mori-Say]
    begriffe: [mehrspindel, multi-spindle, multispindle, multi spindle, multiswiss]
    ausschluss: [stangenlader, lademagazin, spannzange]
    quellen:
      maschinensucher: [/Mehrspindler/ci-1137]
      resale: [mehrspindeldrehautomat]

  - id: spritzgiessmaschine
    name: Spritzgießmaschine Holmklasse 370–720
    gruppe: Spritzguss
    holmklassen: true        # Einordnung nach lichter Holmweite (Arburg Allrounder 370 bis 720)
    wunschmodelle: [Allrounder]   # Arburg bevorzugt
    spez:
      baujahr_min: 2010
      kraft_kn: [400, 3300]
    hersteller: [Arburg, Engel, Fanuc, Sumitomo, Demag, KraussMaffei, Krauss Maffei, Wittmann Battenfeld, Battenfeld, Nissei, Boy, Toyo, JSW]
    begriffe: [spritzgie, spritzguss, injection mold, injection mould, allrounder, roboshot]
    ausschluss: [werkzeug, temperiergerät, trockner, granulat, förderband, ersatzteil, schnecke]
    quellen:
      maschinensucher: [/Schliesskraft-250-999-kN/ci-1214, /Schliesskraft-1000-4999-kN/ci-1215]
      resale: [spritzgiessmaschine]
      surplusrecord: [screw-type-injection-molding-machine/arburg, screw-type-injection-molding-machine/fanuc, screw-type-injection-molding-machine/engel]

# NetBid: Auktionskalender wird nach diesen Begriffen durchsucht (Titel der Auktion).
auktionen:
  begriffe: [punching, stamping, injection mould, injection mold, plastics processing, lathe, turning, metalworking, metal working, connector, electrical engineering]

# Insolvenz-Monitor (Quelle: Meldungen der Insolvenzkanzleien bei INDat).
insolvenzen:
  monate: 18            # Meldungen der letzten n Monate
  seiten_aktuell: 3     # je 100 jüngste Meldungen
  min_prozent: 30       # Mindest-Wahrscheinlichkeit für die Aufnahme
  suchbegriffe: [Stanztechnik, Stanzteile, Umformtechnik, Spritzguss, Kunststofftechnik, Drehteile, Zerspanung, Steckverbinder, Metallverarbeitung]
  # Stichworte, aus denen die Wahrscheinlichkeit geschätzt wird (stark 55 %, mittel 30 %, schwach 12 %).
  indizien:
    Stanzen:
      stark: [stanztechnik, stanzteil, stanzbiege, stanzerei, feinschneid, stanz- und]
      mittel: [umformtechnik, blechumform, metallumform, kontaktteile, pressteile, stanz]
    Drehen:
      stark: [drehteil, dreherei, langdreh, drehautomat]
      mittel: [zerspan, cnc-bearbeitung, präzisionsteile, cnc-dreh]
    Spritzguss:
      stark: [spritzguss, spritzgieß, spritzgiess]
      mittel: [kunststofftechnik, kunststoffteile, kunststoffverarbeit, kunststoffkomponenten]
    allgemein:
      stark: [steckverbinder, steckverbindung, kontaktsystem]
      schwach: [automobilzulieferer, metallverarbeit, elektrotechnik, zulieferer]
